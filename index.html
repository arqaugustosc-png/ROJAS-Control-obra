:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--fg:#ecebe6;--card:#202226;--mut:#9a9a94;--bd:#33353b;--acc:#6aa7ec;--ok:#4fb27f;--wip:#e5b04a;--chip:#2a2c31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:4px 0 2px}h2{font-size:15px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:700}
button,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.fl{display:block;width:100%;text-align:left;background:var(--card);margin:8px 0;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;padding:8px 14px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button{padding:10px 4px;font-size:14px}
.seg button.on0{background:var(--mut);color:var(--bg)}.seg button.on1{background:var(--wip);color:#1d1d1b;border-color:var(--wip)}.seg button.on2{background:var(--ok);color:#fff;border-color:var(--ok)}
.chg{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);z-index:5}
.modal>div{background:var(--bg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.ban{background:#7a2e2e;color:#fff;padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
