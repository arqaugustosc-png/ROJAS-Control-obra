<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--bd:#dcdad2;--acc:#1f5fa8;--ok:#2e8b57;--wip:#d89a1d;--chip:#ecebe5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16171a;--fg:#ecebe6;--card:#202226;--mut:#9a9a94;--bd:#33353b;--acc:#6aa7ec;--ok:#4fb27f;--wip:#e5b04a;--chip:#2a2c31}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--fg:#ecebe6;--card:#202226;--mut:#9a9a94;--bd:#33353b;--acc:#6aa7ec;--ok:#4fb27f;--wip:#e5b04a;--chip:#2a2c31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:4px 0 2px}h2{font-size:15px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:700}
button,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.fl{display:block;width:100%;text-align:left;background:var(--card);margin:8px 0;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;padding:8px 14px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button{padding:10px 4px;font-size:14px}
.seg button.on0{background:var(--mut);color:var(--bg)}.seg button.on1{background:var(--wip);color:#1d1d1b;border-color:var(--wip)}.seg button.on2{background:var(--ok);color:#fff;border-color:var(--ok)}
.chg{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);z-index:20}
.modal>div{background:var(--bg);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.ban{background:#7a2e2e;color:#fff;padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
.stk{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;margin:0 -14px;padding:8px 14px 2px;border-bottom:1px solid var(--bd)}
.stk h1{margin:0;font-size:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.mn{white-space:pre-wrap;font:14px/1.4 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:50vh;overflow:auto;margin:10px 0}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:6px}
.nt{padding:8px 0;border-top:1px solid var(--bd);margin-top:8px}.nt.dn span{text-decoration:line-through;color:var(--mut)}.nt input{width:20px;height:20px;vertical-align:middle}

function prog(str,f,u){let a=0,n=0;const us=u==null?F[f][1].map((_,i)=>i):[u];for(const k of us)for(let t=0;t<T;t++){if(NA(f,k,t))continue;n++;const c=str[k*T+t];a+=c==='2'?1:c==='1'?.5:0}return[a,n]}

[us.length-1,...us.map((_,i)=>i).slice(0,-1)].forEach(i=>{const u=us[i],p=prog(s,f,i);h+=`<button data-a="unit" data-u="${i}" class="${i===ui?'on':''}">${u[0]==='PA'?'Pasillo':u[0]} · ${p[1]?pc(p[0]/p[1]):'—'}${nof(f,i).some(n=>!n.x)?' 📝':''}</button>`});
h+='</div></div>';h+=notesBlock(f,ui);const b=lv(f);let cs=-1;
ORD.forEach(t=>{const tk=D.tasks[t];if(NA(f,ui,t))return;if(tk[1]!==cs){cs=tk[1];h+=`<h2>${D.secs[cs]}</h2>`}
const c=+s[ui*T+t],ch=b&&b[ui*T+t]!==s[ui*T+t],n=P[`${f}.${ui}.${t}`]||0;
h+=`<div class="card"><div class="row"><b>${tk[0]}${ch?'<span class="chg"></span>':''}</b><button data-a="ph" data-t="${t}">📷 ${n||''}</button></div>
<div class="seg">${['Pendiente','En obra','Terminado'].map((l,k)=>`<button data-a="set" data-t="${t}" data-v="${k}" class="${c===k?'on'+k:''}">${l}</button>`).join('')}</div></div>`});
return h}
function hist(){const ks=Object.keys(V).sort().reverse(),td=today();
let h=`<button data-a="home">← Edificio</button><h1>Visitas</h1><div class="card"><div class="sub">Cerrar la visita guarda el estado actual con su fecha para comparar con la próxima.</div>
<div class="row" style="margin-top:8px"><input type="date" id="vd" value="${td}"><button class="p" data-a="close">Cerrar visita</button></div></div>`;
h+='<div class="card"><div class="sub">Respaldo de datos (sin fotos)</div><div class="row" style="margin-top:8px"><button data-a="exp">Exportar</button><label><button onclick="this.nextElementSibling.click()">Importar</button><input type="file" accept="application/json" hidden id="imf"></label></div></div>';ks.forEach((k,i)=>{const t=tot(f=>V[k].fl['f'+f]||gs(f)),pk=ks[i+1],d=pk?t-tot(f=>V[pk].fl['f'+f]||gs(f)):null;
h+=`<div class="card"><div class="row"><b>${k}</b><span>${pc(t)}${d!=null?` <span class="sub">(${d>=0?'+':''}${Math.round(d*100)} pts)</span>`:''}</span></div>${bar(t)}${V[k].minuta?`<button data-a="mn" data-d="${k}" style="margin-top:8px">Ver minuta</button>`:''}</div>`});

function mdl(){const k=modal,t=+k.split('.')[2];
return`<div class="modal" data-a="x"><div><div class="row"><b>${D.tasks[t][0]}</b><button data-a="x">Cerrar</button></div>
<div class="sub">${F[fi][0]} · ${F[fi][1][ui][0]}</div><p><label><button class="p" onclick="this.nextElementSibling.click()">Sacar o elegir foto</button><input type="file" accept="image/*" capture="environment" hidden id="pf"></label></p>
<div class="ph">${MP.map(p=>`<a href="${p.u}" target="_blank"><img src="${p.u}" alt=""><div class="sub">${p.d.slice(5)}</div></a>`).join('')||'<span class="sub">Sin fotos todavía.</span>'}</div></div></div>`}
window.addEventListener('error',e=>{const b=document.createElement('div');b.className='ban';b.textContent='Error: '+e.message;document.body.prepend(b)});
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const save=()=>LS('obra_S',S);
const idbOpen=()=>new Promise(r=>{try{const q=indexedDB.open('obra',1);q.onupgradeneeded=()=>{q.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}).createIndex('k','k')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const rq=q=>new Promise((a,b)=>{q.onsuccess=()=>a(q.result);q.onerror=()=>b(q.error)});
async function loadMP(k){MP.forEach(p=>URL.revokeObjectURL(p.u));MP=[];if(!idb)return;const r=await rq(idb.transaction('photos').objectStore('photos').index('k').getAll(k));MP=r.sort((a,b)=>a.d<b.d?-1:1).map(x=>({u:URL.createObjectURL(x.blob),d:x.d}))}
async function shrink(file){const im=await createImageBitmap(file),r=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(o=>c.toBlob(o,'image/jpeg',.72))}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(a==='x'){if(e.target.closest('.modal>div')&&el.tagName!=='BUTTON')return;modal=null;mnv=null}
else if(a==='home')view='home';else if(a==='hist')view='hist';
else if(a==='floor'){fi=+el.dataset.f;ui=F[fi][1].length-1;view='floor';draft=''}else if(a==='unit'){ui=+el.dataset.u;draft=''}
else if(a==='set'){const t=+el.dataset.t,s=gs(fi),i=ui*T+t;S[fi]=s.slice(0,i)+el.dataset.v+s.slice(i+1);save()}
else if(a==='ph'){modal=`${fi}.${ui}.${el.dataset.t}`;MP=[];render();await loadMP(modal);return render()}
else if(a==='close'){const d=$('#vd').value;if(!d)return;const fl={};F.forEach((_,f)=>fl['f'+f]=gs(f));N.forEach(n=>{if(!n.v)n.v=d});V[d]={date:d,fl};V[d].minuta=minuta(d);LS('obra_V',V);LS('obra_N',N);mnv=V[d].minuta}
else if(a==='nadd'){const x=draft.trim();if(!x)return;N.push({id:Date.now(),f:fi,u:ui,t:x,d:today(),x:0,v:null});draft='';LS('obra_N',N)}
else if(a==='ndone'){const n=N.find(n=>n.id==el.dataset.i);if(n){n.x=n.x?0:1;LS('obra_N',N)}}
else if(a==='ndel'){if(!confirm('¿Borrar esta nota?'))return;N=N.filter(n=>n.id!=el.dataset.i);LS('obra_N',N)}
else if(a==='mn')mnv=V[el.dataset.d].minuta
else if(a==='mcopy')return copyM()
else if(a==='mshare'){try{if(navigator.share)await navigator.share({title:'Minuta de visita a obra',text:mnv});else copyM()}catch(x){}return}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify({S,V,P,N})],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='respaldo-obra-'+new Date().toISOString().slice(0,10)+'.json';l.click()}
render()});
document.addEventListener('change',async e=>{const i=e.target,f0=i.files&&i.files[0];if(!f0)return;
if(i.id==='imf'){try{const o=JSON.parse(await f0.text());S=o.S;V=o.V;P=o.P||{};N=o.N||[];LS('obra_N',N);migAll();LS('obra_S',S);LS('obra_V',V);LS('obra_P',P);render()}catch(x){alert('Archivo inválido')}return}
if(i.id!=='pf'||!idb)return;const k=modal,[f,u,t]=k.split('.').map(Number);
try{const blob=await shrink(f0);await rq(idb.transaction('photos','readwrite').objectStore('photos').add({k,f,u,t,d:today(),blob}));P[k]=(P[k]||0)+1;LS('obra_P',P);await loadMP(k);render()}catch(x){alert('No se pudo guardar la foto')}});
const ORD=D.tasks.map((_,i)=>i).sort((a,b)=>D.tasks[a][1]-D.tasks[b][1]||a-b);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>d.split('-').reverse().join('/');
const uname=(f,u)=>{const n=F[f][1][u][0];return n==='PA'?'Pasillo':/^[A-G]$/.test(n)?'Depto '+n:n};
const nof=(f,u)=>N.filter(n=>n.f===f&&n.u===u);
function notesBlock(f,u){const l=nof(f,u),o=l.filter(n=>!n.x).length;
return `<div class="card"><b>📝 Notas de ${uname(f,u)}${o?` (${o} abiertas)`:''}</b><textarea id="nt" rows="2" placeholder="Escribí una observación…">${esc(draft)}</textarea>
<div class="row" style="margin-top:6px"><span class="sub">Van a la minuta al cerrar la visita</span><button class="p" data-a="nadd">Agregar</button></div>
${l.map(n=>`<div class="nt${n.x?' dn':''}"><label><input type="checkbox" data-a="ndone" data-i="${n.id}" ${n.x?'checked':''}> <span>${esc(n.t)}</span></label><div class="sub">${fmt(n.d)}${n.v?' · enviada en la visita del '+fmt(n.v):' · sin enviar'} <button data-a="ndel" data-i="${n.id}" style="padding:2px 8px">🗑</button></div></div>`).join('')}</div>`}
function minuta(d){const ks=Object.keys(V).sort(),pk=ks[ks.indexOf(d)-1],t=tot(f=>V[d].fl['f'+f]),dl=pk?Math.round((t-tot(f=>V[pk].fl['f'+f]))*100):null;
const grp=l=>{let o='';for(let f=F.length-1;f>=0;f--){const us=F[f][1],ord=[us.length-1,...us.map((_,i)=>i).slice(0,-1)];let fs='';
for(const u of ord){const a=l.filter(n=>n.f===f&&n.u===u);if(a.length)fs+=' '+uname(f,u)+':\n'+a.map(n=>'  • '+n.t+(n.v!==d?' ('+fmt(n.d)+')':'')).join('\n')+'\n'}
if(fs)o+='\n'+F[f][0].toUpperCase()+'\n'+fs}return o};
const nw=N.filter(n=>n.v===d&&!n.x),pe=N.filter(n=>!n.x&&n.v&&n.v<d);
return 'MINUTA DE VISITA A OBRA\nRojas 1892 · J.B. Justo 3402\nFecha: '+fmt(d)+'\nAvance general: '+pc(t)+(dl!=null?' ('+(dl>=0?'+':'')+dl+' pts desde la visita anterior)':'')+'\n\nOBSERVACIONES DE ESTA VISITA'+(nw.length?grp(nw):'\n(sin observaciones nuevas)\n')+(pe.length?'\nPENDIENTES DE VISITAS ANTERIORES'+grp(pe):'')}
const mm=()=>`<div class="modal" data-a="x"><div><div class="row"><b>Minuta de visita</b><button data-a="x">Cerrar</button></div><pre class="mn">${esc(mnv)}</pre><div class="row"><button class="p" data-a="mshare">Compartir</button><button data-a="mcopy">Copiar texto</button></div></div></div>`;

const T0=76,OP=D.op;
function migStr(s,f){const us=F[f][1],n=us.length-1;
if(s&&s.length===us.length*T)return s;

let o='',g='';for(let k=0;k<n;k++)o+=s.slice(k*T0,(k+1)*T0)+'000';

return o+g+'0'.repeat(T-6)}
function migAll(){let ch=0;F.forEach((_,f)=>{const n=migStr(S[f],f);if(n!==S[f]){S[f]=n;ch=1}});
Object.values(V).forEach(v=>{v.fl=v.fl||{};F.forEach((_,f)=>{const n=migStr(v.fl['f'+f],f);if(n!==v.fl['f'+f]){v.fl['f'+f]=n;ch=1}})});
if(ch){LS('obra_S',S);LS('obra_V',V)}}
async function migPh(){if(!idb||LS('obra_ph2'))return;try{const tx=idb.transaction('photos','readwrite'),st=tx.objectStore('photos'),all=await rq(st.getAll());
for(const r of all){const g=F[r.f][1].length-1;if(r.t<6&&r.u<g){r.u=g;r.k=r.f+'.'+g+'.'+r.t;st.put(r)}}
await new Promise(a=>{tx.oncomplete=a;tx.onerror=a;tx.onabort=a});
const c={};(await rq(idb.transaction('photos').objectStore('photos').getAll())).forEach(r=>c[r.k]=(c[r.k]||0)+1);P=c;LS('obra_P',P);LS('obra_ph2',1)}catch(e){}}
(async()=>{N=LS('obra_N')||[];S=LS('obra_S')||{};V=LS('obra_V');P=LS('obra_P')||{};
if(!V||!Object.keys(V).length){V=SEED;LS('obra_V',V)}

migAll();LS('obra_S',S);
render();idb=await Promise.race([idbOpen(),new Promise(r=>setTimeout(()=>r(null),2500))]);await migPh();render()})();
